[package]
name = "agent-vault"
description = "Beeline Relay agent vault: on-chain spend limits for AI agents paying through NEAR Intents 1Click"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dev-doji/beeline-relay"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
# arbitrary_precision keeps numbers byte-exact when re-serializing signed 1Click payloads.
serde_json = { version = "1", features = ["arbitrary_precision"] }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
