# Gitleaks config: the default rules plus NEAR AI Cloud API keys.
[extend]
useDefault = true

[[rules]]
id = "near-ai-api-key"
description = "NEAR AI Cloud API key"
regex = '''\bsk-[A-Za-z0-9]{32}\b'''
keywords = ["sk-"]

[allowlist]
description = "Test fixtures that contain only public test keys and signatures"
paths = ['''contracts/agent-vault/src/testdata/go_review\.json''']
