name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beeline-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: beeline-api/go.mod
          cache-dependency-path: beeline-api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        # Integration tests run against the isolated Neon "test" branch when the secret is
        # configured, and are skipped otherwise (e.g. on forks).
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: go test -race -count=1 ./...
      - name: build
        run: go build ./...

  vault:
    name: Agent vault contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/agent-vault
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/agent-vault
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: unit tests (includes live 1Click signature fixture)
        run: cargo test
      - name: wasm build
        run: cargo build --target wasm32-unknown-unknown --release

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Scan the full history with the gitleaks CLI. The gitleaks GitHub action
      # fails on a repository's first push because the root commit has no parent.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --verbose --exit-code 1
