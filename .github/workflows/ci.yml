name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beeline-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: beeline-api/go.mod
          cache-dependency-path: beeline-api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        # Integration tests run against the isolated Neon "test" branch when the secret is
        # configured, and are skipped otherwise (e.g. on forks).
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: go test -race -count=1 ./...
      - name: build
        run: go build ./...

  vault:
    name: Agent vault contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/agent-vault
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/agent-vault
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: unit tests (includes live 1Click signature fixture)
        run: cargo test
      - name: install cargo-near
        # Pinned release, with retries: GitHub release downloads occasionally return 5xx.
        run: |
          set -o pipefail
          curl --proto '=https' --tlsv1.2 -LsSf --retry 5 --retry-all-errors --retry-delay 5             https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
          cargo near --version
      - name: optimized wasm build
        run: |
          cargo near build non-reproducible-wasm
          ls -l target/near/
      - uses: actions/upload-artifact@v4
        with:
          name: agent-vault-wasm
          path: |
            contracts/agent-vault/target/near/agent_vault.wasm
            contracts/agent-vault/target/near/agent_vault_abi.json
          if-no-files-found: error

  web:
    name: Website and playground
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beeline-web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: beeline-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: build
        run: pnpm build

  container:
    name: API container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker build (the image Render deploys)
        run: docker build -t beeline-api ./beeline-api

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Scan the full history with the gitleaks CLI. The gitleaks GitHub action
      # fails on a repository's first push because the root commit has no parent.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --verbose --exit-code 1
